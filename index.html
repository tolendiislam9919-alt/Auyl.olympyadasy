<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Физика олимпиадасы — тренажер (9-сынып)</title>
<style>
:root{
  --paper:#FAF7F0; --paper2:#F2EDE3; --grid:#DCD5C6;
  --ink:#1B2A4A; --ink2:#44536E; --muted:#7D8599;
  --red:#B03A2E; --green:#1E7A54; --amber:#C8871B;
  --line:#CFC7B6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;
  padding:0 0 60px;
}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.25;margin:0}
.sheet{
  background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 0 #fff inset, 2px 3px 0 rgba(27,42,74,.07);
  padding:26px 28px;margin:22px 0;
}
.hidden{display:none !important}

/* ---------- кіру ---------- */
.hero{text-align:center;padding:34px 28px 30px}
.hero .eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700}
.hero h1{font-size:30px;margin:10px 0 6px}
.hero .sub{color:var(--ink2);font-size:15px}
.facts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 4px}
.fact{border:1px solid var(--line);padding:9px 14px;min-width:96px;background:var(--paper2)}
.fact b{display:block;font-family:Georgia,serif;font-size:21px}
.fact span{font-size:12px;color:var(--muted)}
.form{max-width:380px;margin:24px auto 0;text-align:left}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 5px;font-weight:600}
input[type=text]{
  width:100%;padding:11px 13px;border:1px solid var(--line);background:var(--paper);
  font:16px inherit;color:var(--ink);border-radius:2px;
}
input[type=text]:focus{outline:2px solid var(--ink);outline-offset:-1px;background:#fff}
.btn{
  display:inline-block;border:1px solid var(--ink);background:var(--ink);color:#fff;
  font:600 15px/1 inherit;padding:13px 24px;cursor:pointer;border-radius:2px;
}
.btn:hover{background:#101d36}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--paper2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%;margin-top:20px;padding:14px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}

/* ---------- тест ---------- */
.topbar{
  position:sticky;top:0;z-index:5;background:var(--paper);
  border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:0;
}
.topbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.who{font-weight:600;font-size:14px}
.who small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.bar{flex:1;min-width:140px;height:7px;background:var(--paper2);border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.clock{font-family:Georgia,serif;font-size:17px;letter-spacing:.04em}

.qhead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.qnum{font-family:Georgia,serif;font-size:30px;color:var(--ink)}
.badge{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  border:1px solid var(--amber);color:var(--amber);padding:3px 8px}
.badge.lv2{border-color:#2E6DA4;color:#2E6DA4}
.badge.lv3{border-color:var(--red);color:var(--red)}
.topic{font-size:12.5px;color:var(--muted);margin-left:auto}
.qtext{font-size:17px;margin-bottom:4px}
.qru{font-size:13.5px;color:var(--muted);font-style:italic;margin-bottom:14px}
.fig{margin:4px 0 16px;text-align:center}
.fig img{max-width:100%;border:1px solid var(--line);background:#fff;padding:6px}

.opts{display:grid;gap:8px;margin-top:6px}
.opt{
  display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);
  background:var(--paper);padding:11px 14px;cursor:pointer;
}
.opt:hover{background:var(--paper2)}
.opt input{margin:3px 0 0;accent-color:var(--ink);flex:none}
.opt .k{font-family:Georgia,serif;font-weight:700;flex:none;width:17px}
.opt.sel{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.opt.ok{border-color:var(--green);background:#F0F8F4}
.opt.bad{border-color:var(--red);background:#FCF2F1}

.nav{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.nav .spacer{flex:1}
.map{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.map b{
  width:30px;height:30px;display:grid;place-items:center;font:600 13px/1 inherit;
  border:1px solid var(--line);background:var(--paper);cursor:pointer;
}
.map b.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.map b.cur{outline:2px solid var(--amber);outline-offset:1px}

/* ---------- нәтиже ---------- */
.score{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.ring{width:132px;height:132px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:Georgia,serif;font-size:30px;display:block;line-height:1}
.ring .val span{font-size:11px;color:var(--muted)}
.verdict{font-family:Georgia,serif;font-size:21px;margin-bottom:4px}
.rows{margin-top:18px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row .nm{flex:1}
.row .mini{width:120px;height:6px;background:var(--paper2);border:1px solid var(--line);flex:none}
.row .mini i{display:block;height:100%;background:var(--green)}
.row .mini i.low{background:var(--red)}
.row .cnt{width:54px;text-align:right;font-family:Georgia,serif;flex:none}

/* ---------- қатемен жұмыс ---------- */
.mistake{border:1px solid var(--line);border-left:3px solid var(--red);margin:14px 0;background:#fff}
.mistake>summary{padding:12px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
.mistake>summary::-webkit-details-marker{display:none}
.mistake>summary .n{font-family:Georgia,serif;color:var(--red);font-size:19px}
.mistake>summary .t{flex:1;font-weight:400;font-size:14.5px}
.mistake>summary .chev{color:var(--muted);font-size:12px}
.mbody{padding:0 16px 16px;border-top:1px dashed var(--line);margin-top:2px}
.answers{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.ansbox{border:1px solid var(--line);padding:8px 12px;font-size:14px;flex:1;min-width:180px}
.ansbox.bad{border-color:var(--red);background:#FCF2F1}
.ansbox.ok{border-color:var(--green);background:#F0F8F4}
.ansbox small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.sol{background:var(--paper2);border:1px solid var(--line);padding:13px 15px;font-size:14.5px}
.sol h4{margin:0 0 7px;font:700 13px/1 inherit;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.sol .step{margin:5px 0}
.fm{font-family:Georgia,"Cambria",serif;font-size:15.5px;background:#fff;border:1px solid var(--line);
  padding:4px 9px;display:inline-block;margin:3px 0}

/* ---------- конспект ---------- */
.note{border:1px solid var(--line);background:#fff;margin:16px 0;padding:18px 20px}
.note h3{font-size:19px;margin-bottom:3px}
.note .why{font-size:12.5px;color:var(--red);margin-bottom:12px}
.note ul{margin:9px 0 0;padding-left:20px}
.note li{margin:5px 0;font-size:14.5px}
.note .tip{margin-top:13px;border-left:3px solid var(--amber);background:var(--paper2);padding:9px 13px;font-size:14px}
.note .tip b{color:var(--amber)}
.secthead{display:flex;align-items:baseline;gap:12px;margin:34px 0 2px}
.secthead h2{font-size:23px}
.secthead .line{flex:1;height:1px;background:var(--line)}
.lead{color:var(--ink2);font-size:14.5px;margin:6px 0 0}

@media print{
  body{background:#fff}
  .topbar,.nav,.map,.noprint{display:none !important}
  .sheet,.note,.mistake{box-shadow:none;break-inside:avoid}
}
@media (max-width:620px){
  .sheet{padding:20px 16px}
  .hero h1{font-size:24px}
  .qnum{font-size:25px}
}
</style>
</head>
<body>

<!-- ========== 1. КІРУ ========== -->
<section id="scr-login" class="wrap">
  <div class="sheet hero">
    <div class="eyebrow">Ауыл олимпиадасы · ІІ кезең</div>
    <h1>Физика тренажері</h1>
    <div class="sub">9-сынып · үш деңгейлі тест және қатемен жұмыс</div>
    <div class="facts">
      <div class="fact"><b>30</b><span>сұрақ</span></div>
      <div class="fact"><b>3</b><span>деңгей</span></div>
      <div class="fact"><b>60</b><span>минут</span></div>
    </div>
    <div class="form">
      <label for="nm">Аты-жөнің</label>
      <input id="nm" type="text" placeholder="Мысалы: Айдана Сәрсенова" autocomplete="off">
      <label for="cl">Сыныбың <span style="color:var(--muted);font-weight:400">(міндетті емес)</span></label>
      <input id="cl" type="text" placeholder="9 «А»" autocomplete="off">
      <div class="err" id="loginErr"></div>
      <button class="btn wide" id="startBtn">Тестті бастау</button>
      <button class="btn ghost wide hidden" id="resumeBtn" style="margin-top:10px">Сақталған жұмысты жалғастыру</button>
    </div>
  </div>
</section>

<!-- ========== 2. ТЕСТ ========== -->
<div id="scr-test" class="hidden">
  <div class="topbar">
    <div class="wrap">
      <div class="who" id="whoBox"></div>
      <div class="bar"><i id="progBar"></i></div>
      <div class="clock" id="clock">60:00</div>
    </div>
  </div>
  <div class="wrap">
    <div class="sheet" id="qCard"></div>
  </div>
</div>

<!-- ========== 3. НӘТИЖЕ ========== -->
<div id="scr-result" class="hidden">
  <div class="wrap" id="resultBody"></div>
</div>

 ru:"Отец везёт сына на санках с постоянной скоростью. Он совершил работу 2000 Дж, проделав путь 50 м. Определите модуль силы трения.",

const LVNAME = {1:"І деңгей",2:"ІІ деңгей",3:"ІІІ деңгей"};
const KEY = "olimp9_fizika_v1";
const LET = ["A","B","C","D"];

let S = {name:"", cls:"", ans:Array(Q.length).fill(null), cur:0, left:60*60, done:false};
let timer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }

/* ---------- кіру ---------- */
const saved = load();
if (saved && saved.name && !saved.done && saved.ans.some(a=>a!==null)) {
  $("#resumeBtn").classList.remove("hidden");
  $("#resumeBtn").textContent = "«" + saved.name + "» жұмысын жалғастыру";
  $("#resumeBtn").onclick = () => { S = saved; beginTest(); };
}
$("#startBtn").onclick = () => {
  const nm = $("#nm").value.trim();
  if (nm.length < 3) { $("#loginErr").textContent = "Аты-жөніңді толық жаз (кемінде 3 әріп)."; $("#nm").focus(); return; }
  S = {name:nm, cls:$("#cl").value.trim(), ans:Array(Q.length).fill(null), cur:0, left:60*60, done:false};
  beginTest();
};
$("#nm").addEventListener("keydown", e => { if (e.key === "Enter") $("#startBtn").click(); });

function beginTest(){
  $("#scr-login").classList.add("hidden");
  $("#scr-result").classList.add("hidden");
  $("#scr-test").classList.remove("hidden");
  $("#whoBox").innerHTML = esc(S.name) + (S.cls ? "<small>" + esc(S.cls) + "</small>" : "");
  clearInterval(timer);
  timer = setInterval(tick, 1000);
  drawQ();
  window.scrollTo(0,0);
}

function tick(){
  S.left--;
  if (S.left <= 0) { S.left = 0; clearInterval(timer); finish(true); return; }
  const m = String(Math.floor(S.left/60)).padStart(2,"0"), s = String(S.left%60).padStart(2,"0");
  $("#clock").textContent = m + ":" + s;
  if (S.left % 10 === 0) save();
}

/* ---------- сұрақ ---------- */
function drawQ(){
  const q = Q[S.cur];
  const lv = q.lv;
  let h = '<div class="qhead"><span class="qnum">' + q.n + '.</span>' +
          '<span class="badge lv' + lv + '">' + LVNAME[lv] + '</span>' +
          '<span class="topic">' + TOPICS[q.tp].t + '</span></div>' +
          '<div class="qtext">' + q.kk + '</div>' +
          '<div class="qru">' + q.ru + '</div>';
  if (q.fig && FIGS[q.fig]) h += '<div class="fig"><img alt="сурет" src="' + FIGS[q.fig] + '"></div>';
  h += '<div class="opts">';
  q.o.forEach((o,i) => {
    const sel = S.ans[S.cur] === i ? " sel" : "";
    h += '<label class="opt' + sel + '"><input type="radio" name="o" value="' + i + '"' +
         (sel?" checked":"") + '><span class="k">' + LET[i] + ')</span><span>' + o + '</span></label>';
  });
  h += '</div>';
  h += '<div class="nav">' +
       '<button class="btn ghost" id="prevBtn"' + (S.cur===0?" disabled":"") + '>← Алдыңғы</button>' +
       '<button class="btn ghost" id="nextBtn"' + (S.cur===Q.length-1?" disabled":"") + '>Келесі →</button>' +
       '<span class="spacer"></span>' +
       '<button class="btn" id="finBtn">Аяқтау</button></div>';
  h += '<div class="map">';
  Q.forEach((qq,i) => {
    h += '<b data-i="' + i + '" class="' + (S.ans[i]!==null?"done ":"") + (i===S.cur?"cur":"") + '">' + (i+1) + '</b>';
  });
  h += '</div>';
  $("#qCard").innerHTML = h;

  $("#qCard").querySelectorAll('input[name=o]').forEach(r => {
    r.onchange = () => { S.ans[S.cur] = +r.value; save(); drawQ(); };
  });
  $("#prevBtn").onclick = () => { if (S.cur>0){ S.cur--; drawQ(); } };
  $("#nextBtn").onclick = () => { if (S.cur<Q.length-1){ S.cur++; drawQ(); } };
  $("#finBtn").onclick = () => finish(false);
  $("#qCard").querySelectorAll(".map b").forEach(b => {
    b.onclick = () => { S.cur = +b.dataset.i; drawQ(); window.scrollTo(0,0); };
  });
  const n = S.ans.filter(a=>a!==null).length;
  $("#progBar").style.width = (n/Q.length*100) + "%";
}

/* ---------- аяқтау ---------- */
function finish(auto){
  const left = S.ans.filter(a=>a===null).length;
  if (!auto && left > 0 &&
      !confirm(left + " сұрақ жауапсыз қалды. Сонда да аяқтайсың ба?")) return;
  clearInterval(timer);
  S.done = true; save();
  $("#scr-test").classList.add("hidden");
  $("#scr-result").classList.remove("hidden");
  renderResult();
  window.scrollTo(0,0);
}

function renderResult(){
  const wrong = [], right = [];
  Q.forEach((q,i) => (S.ans[i] === q.a ? right : wrong).push(i));
  const sc = right.length, pc = Math.round(sc/Q.length*100);

  // деңгей бойынша
  const byLv = {1:[0,0],2:[0,0],3:[0,0]};
  Q.forEach((q,i) => { byLv[q.lv][1]++; if (S.ans[i]===q.a) byLv[q.lv][0]++; });
  // тақырып бойынша
  const byTp = {};
  Q.forEach((q,i) => {
    byTp[q.tp] = byTp[q.tp] || [0,0];
    byTp[q.tp][1]++; if (S.ans[i]===q.a) byTp[q.tp][0]++;
  });

  let verdict, vcol;
  if (pc >= 85) { verdict = "Тамаша! Олимпиадаға дайынсың."; vcol = "var(--green)"; }
  else if (pc >= 65) { verdict = "Жақсы нәтиже. Бірер тақырыпты пысықтау керек."; vcol = "var(--ink)"; }
  else if (pc >= 40) { verdict = "Орташа. Қатемен жұмысты мұқият оқы."; vcol = "var(--amber)"; }
  else { verdict = "Тақырыптарды қайта қарау қажет. Конспектіден баста."; vcol = "var(--red)"; }

  const C = 2*Math.PI*54;
  let h = '<div class="sheet"><div class="score">' +
    '<div class="ring"><svg width="132" height="132">' +
      '<circle cx="66" cy="66" r="54" fill="none" stroke="var(--paper2)" stroke-width="13"></circle>' +
      '<circle cx="66" cy="66" r="54" fill="none" stroke="' + vcol + '" stroke-width="13" ' +
        'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C*(1-pc/100)) + '" stroke-linecap="butt"></circle>' +
    '</svg><div class="val"><b>' + pc + '%</b><span>' + sc + ' / ' + Q.length + '</span></div></div>' +
    '<div style="flex:1;min-width:220px">' +
      '<div class="verdict">' + verdict + '</div>' +
      '<div style="color:var(--ink2)">' + esc(S.name) + (S.cls ? ", " + esc(S.cls) : "") +
      ' · дұрыс <b>' + sc + '</b>, қате <b>' + wrong.length + '</b></div>' +
    '</div></div>';

  h += '<div class="rows">';
  [1,2,3].forEach(lv => {
    const [a,b] = byLv[lv], p = Math.round(a/b*100);
    h += '<div class="row"><span class="nm">' + LVNAME[lv] + '</span>' +
         '<span class="mini"><i class="' + (p<60?"low":"") + '" style="width:' + p + '%"></i></span>' +
         '<span class="cnt">' + a + '/' + b + '</span></div>';
  });
  h += '</div>';
  h += '<div class="nav noprint"><button class="btn ghost" id="againBtn">Қайта тапсыру</button>' +
       '<span class="spacer"></span><button class="btn" id="printBtn">Конспектіні басып шығару</button></div>';
  h += '</div>';

  // ----- тақырыптар -----
  h += '<div class="secthead"><h2>Тақырыптар бойынша</h2><span class="line"></span></div>';
  h += '<div class="sheet"><div class="rows" style="border-top:none">';
  Object.keys(byTp).sort((x,y) => byTp[x][0]/byTp[x][1] - byTp[y][0]/byTp[y][1]).forEach(tp => {
    const [a,b] = byTp[tp], p = Math.round(a/b*100);
    h += '<div class="row"><span class="nm">' + TOPICS[tp].t + '</span>' +
         '<span class="mini"><i class="' + (p<60?"low":"") + '" style="width:' + p + '%"></i></span>' +
         '<span class="cnt">' + a + '/' + b + '</span></div>';
  });
  h += '</div></div>';

  // ----- қатемен жұмыс -----
  h += '<div class="secthead"><h2>Қатемен жұмыс</h2><span class="line"></span></div>';
  if (!wrong.length) {
    h += '<div class="sheet"><p style="margin:0">Бір де бір қате жоқ — барлық 30 сұраққа дұрыс жауап бердің. Жарайсың!</p></div>';
  } else {
    h += '<p class="lead">Төменде қате жіберген ' + wrong.length +
         ' сұрақ тұр. Әрқайсысын ашып, толық шешуін оқы.</p>';
    wrong.forEach(i => {
      const q = Q[i], my = S.ans[i];
      h += '<details class="mistake"><summary><span class="n">' + q.n + '</span>' +
           '<span class="t">' + q.kk.slice(0,78) + (q.kk.length>78?"…":"") + '</span>' +
           '<span class="chev">▼</span></summary><div class="mbody">' +
           '<div class="qtext" style="margin:14px 0 4px;font-size:15.5px">' + q.kk + '</div>';
      if (q.fig && FIGS[q.fig]) h += '<div class="fig"><img alt="сурет" src="' + FIGS[q.fig] + '"></div>';
      h += '<div class="answers">' +
           '<div class="ansbox bad"><small>Сенің жауабың</small>' +
             (my===null ? "<i>жауап берілмеген</i>" : LET[my] + ") " + q.o[my]) + '</div>' +
           '<div class="ansbox ok"><small>Дұрыс жауап</small>' + LET[q.a] + ") " + q.o[q.a] + '</div></div>';
      h += '<div class="sol"><h4>Шешуі</h4>';
      q.s.forEach(st => h += '<div class="step">' + st + '</div>');
      h += '</div></div></details>';
    });
  }

  // ----- жеке конспект -----
  const weak = Object.keys(byTp).filter(tp => byTp[tp][0] < byTp[tp][1]);
  h += '<div class="secthead"><h2>Жеке конспект</h2><span class="line"></span></div>';
  if (!weak.length) {
    h += '<div class="sheet"><p style="margin:0">Барлық тақырып меңгерілген — қосымша конспект қажет емес.</p></div>';
  } else {
    h += '<p class="lead">Конспект тек <b>сен қателескен ' + weak.length +
         ' тақырып</b> бойынша құрылды. Мұны дәптеріңе көшіріп жаз немесе басып шығар.</p>';
    weak.forEach(tp => {
      const nt = NOTES[tp], [a,b] = byTp[tp];
      h += '<div class="note"><h3>' + nt.h + '</h3>' +
           '<div class="why">Бұл тақырыптан ' + (b-a) + ' қате жібердің (' + a + '/' + b + ')</div>';
      h += '<b style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)">Негізгі формулалар</b><ul>';
      nt.f.forEach(x => h += '<li>' + x + '</li>');
      h += '</ul>';
      h += '<b style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:block;margin-top:12px">Есте сақта</b><ul>';
      nt.l.forEach(x => h += '<li>' + x + '</li>');
      h += '</ul>';
      h += '<div class="tip"><b>Кеңес.</b> ' + nt.tip + '</div></div>';
    });
  }

  $("#resultBody").innerHTML = h;
  $("#againBtn").onclick = () => {
    if (!confirm("Жаңадан бастайсың ба? Ағымдағы нәтиже өшеді.")) return;
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  };
  $("#printBtn").onclick = () => window.print();
}
</script>
</body>
</html>
